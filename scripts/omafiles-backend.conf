# Plantilla version-controlada de la config de entorno del backend
# (Fase 5.B.1). Se DESPLIEGA en ~/.config/environment.d/omafiles-backend.conf
#
# Hace que el modulo QML C++ Omafiles.Backend sea importable
# automaticamente en cualquier arranque normal de Omarchy, sin exportar
# nada a mano. Cadena de entrega verificada:
#   systemd --user (environment.d)
#     -> wayland-wm@hyprland.desktop.service (uwsm)
#       -> Hyprland
#         -> quickshell (shell de Omarchy)
# Comprobado: las variables de environment.d (LIBVA_DRIVER_NAME, etc.)
# llegan al proceso quickshell vivo, luego esta llega igual.
#
# La ruta es la de instalacion estable de `cmake --install build`
# (~/.local/lib/qt6/qml), NO el build/ efimero. Additivo por si algo mas
# define QML_IMPORT_PATH (el generador expande ${QML_IMPORT_PATH} vacio a
# nada; el ":" final sobrante lo ignora Qt).
QML_IMPORT_PATH=${HOME}/.local/lib/qt6/qml:${QML_IMPORT_PATH}
