# Version-controlled template of the backend's environment config
# (Phase 5.B.1). It's DEPLOYED to ~/.config/environment.d/omafiles-backend.conf
#
# It makes the C++ QML module Omafiles.Backend automatically importable
# on any normal Omarchy startup, without exporting anything by hand.
# Verified delivery chain:
#   systemd --user (environment.d)
#     -> wayland-wm@hyprland.desktop.service (uwsm)
#       -> Hyprland
#         -> quickshell (Omarchy's shell)
# Confirmed: the environment.d variables (LIBVA_DRIVER_NAME, etc.)
# reach the live quickshell process, so this one arrives the same way.
#
# The path is the stable install one of `cmake --install build`
# (~/.local/lib/qt6/qml), NOT the ephemeral build/. Additive in case something else
# defines QML_IMPORT_PATH (the generator expands an empty ${QML_IMPORT_PATH} to
# nothing; Qt ignores the leftover trailing ":").
QML_IMPORT_PATH=${HOME}/.local/lib/qt6/qml:${QML_IMPORT_PATH}
